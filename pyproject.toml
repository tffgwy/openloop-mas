[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openloop-mas"
version = "0.4.5"
description = "A loop-engineering runtime for multi-agent systems: closure, verification, budgets and an auditable ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["multi-agent", "mas", "loop-engineering", "mcp", "agents", "llm"]
authors = [{ name = "OpenLoop MAS contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/tffgwy/openloop-mas"
Issues = "https://github.com/tffgwy/openloop-mas/issues"

[project.scripts]
mas = "mas.cli:main"
mas-mcp = "mas.mcp_server:main"
mas-http = "mas.http_server:main"

[tool.setuptools]
packages = ["mas"]
include-package-data = true

[tool.setuptools.package-data]
mas = ["teams/*.json"]
