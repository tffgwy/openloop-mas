[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openloop-mas"
version = "0.7.14"
description = "A loop-engineering runtime for multi-agent systems: closure, verification, budgets and an auditable ledger."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["multi-agent", "mas", "loop-engineering", "mcp", "agents", "llm"]
authors = [{ name = "OpenLoop MAS contributors" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/tffgwy/openloop-mas"
Issues = "https://github.com/tffgwy/openloop-mas/issues"

[project.scripts]
mas = "mas.cli:main"
mas-mcp = "mas.mcp_server:main"
mas-http = "mas.http_server:main"

[tool.setuptools]
# `mas.skills` and `mas.teams` hold data, not importable code, but
# setuptools still wants to know about them so the warning "Package X is
# absent from the packages configuration" does not show up on every build.
packages = ["mas", "mas.skills", "mas.teams"]
include-package-data = true

[tool.setuptools.package-data]
# The agent skills travel with the wheel: `pip install openloop-mas` must be
# enough to get a *working* setup, and the skills are what teach Codex /
# Claude Code the workflow. Shipping them is what makes `mas install` able
# to do the whole job on a machine that never cloned the repository.
"mas" = ["teams/*.json", "skills/*/SKILL.md", "skills/*/*.md", "skills/*/*.json"]

[tool.ruff]
# The project ships with zero third-party dependencies, so linting is not
# part of the install path - but it must still be *reproducible*, otherwise
# "ruff passed" depends on whoever's global config happened to be loaded.
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", "work", "site", "outputs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "C4", "RET", "ARG", "PIE", "RUF"]
ignore = [
    # The CLI prints Chinese diagnostics; a few lines legitimately exceed
    # the soft limit and rewrapping them would hurt readability.
    "E501",
    # ``except Exception`` is used on purpose in the HTTP/MCP boundary to
    # report failures back to the caller instead of killing the server.
    "BLE001",
    # Argument shadowing / unused arguments are fine in the small
    # callback-style helpers used by the engine.
    "ARG001",
    "ARG002",
    # RUF001 flags full-width punctuation in Chinese strings. This project
    # is Chinese-first on purpose, so those are not typos.
    "RUF001",
    "RUF002",
    "RUF003",
    # The codebase uses targeted ``# noqa: N802`` / ``# noqa: BLE001``
    # markers. Those rules are not enabled here, so ruff would report the
    # markers themselves as unused.
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
# Tests intentionally poke at private helpers and shadow names.
"tests/*" = ["ARG", "SLF", "PLR2004", "F841", "RUF015"]
# Scripts in tools/ are standalone entry points.
"tools/*" = ["ARG", "PLR2004", "SIM105"]
