name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The site is built and uploaded in one job, and deployed in
  # another. The two used to be one job, and the deployment failed
  # intermittently with
  #
  #     Found 0 artifact(s)
  #     Error: No artifacts named "github-pages" were found for this workflow run.
  #
  # The upload and the deployment look the artifact up in the internal
  # results service, and that index is not updated the instant the
  # upload reports success - a lookup a fraction of a second later
  # comes back empty. See actions/deploy-pages#451.
  #
  # Splitting the jobs is the fix the upstream issue reports as
  # working: the lookup then happens seconds later instead of
  # milliseconds later, and the window closes. It is also the shape
  # every other Pages starter uses.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: python tools/build_site.py
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard the Pages artifact
        # The deploy step reads the artifact back *by name*, and the
        # listing it performs can come back empty for an artifact that
        # was finalized a fraction of a second earlier - see
        # actions/deploy-pages#451. Asking it too early yields
        # "Found 0 artifact(s)" and a red run for a site that is
        # perfectly fine.
        #
        # Re-running a failed attempt makes it worse: the old artifact
        # is not replaced but joined by a second one under the same
        # name, and the deploy step then refuses to choose between them
        # ("Found 2 artifact(s)"). So the guard both waits for the
        # artifact to become visible and removes the stale copies.
        #
        # The guard watches the *same* index the deploy step reads - the
        # internal results service - because the public REST listing is
        # a different one and can be ahead of it.
        #
        # The wait is bounded, and the guard fails the run when the
        # artifact never shows up - a missing upload must not be
        # papered over by a retry.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/pages_artifact_guard.py \
            --repo "${{ github.repository }}" \
            --run-id "${{ github.run_id }}"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
