name: install

# The "one-click install" promise is the whole reason this project exists.
# Until the installer is executed by a machine that has nothing installed,
# the promise is untested - and an installer that silently skips MCP
# registration on a fresh machine looks exactly like a successful install.
#
# This workflow runs the *real* installer in a pristine HOME on every
# supported platform, then asserts that the MCP server it registered can
# actually start and answer.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Linux and Windows are the hard gate. macOS lives in its own workflow
    # file (install-macos.yml) on purpose: GitHub can *cancel* a macOS
    # runner while it is still queued, and such a job reports "cancelled"
    # with zero steps executed. A cancelled job is not a failed job, and
    # ``continue-on-error`` does not cover the cancelled case - only a
    # separate workflow file cannot affect this run's conclusion at all.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install on a pristine machine (Linux / macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${{ runner.temp }}/fresh-home"
          mkdir -p "$HOME"
          export MAS_HOME="$HOME/.mas"
          bash ./install.sh

      - name: Install on a pristine machine (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = "${{ runner.temp }}\fresh-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:MAS_HOME = "$env:USERPROFILE\.mas"
          powershell -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 `
            -InstallDir $env:MAS_HOME

      - name: Assert the fresh install is complete and working
        shell: bash
        run: python tools/verify_install.py "${{ runner.temp }}/fresh-home"

  standalone:
    name: standalone script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      # The "download one script and run it" path is the promise this project
      # makes to beginners, and it is the path the checkout-based job above
      # never exercises: there, the runtime is copied from the source tree.
      #
      # This job therefore copies *only* the installer scripts into an empty
      # directory - no ``mas/`` package, no checkout - and runs them there.
      # The installer then has to fetch the runtime from the published wheel,
      # which is the only way that path can be verified.
      - uses: actions/checkout@v4

      - name: Stage the installer scripts alone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/standalone"
          cp install.ps1 install.sh "${{ runner.temp }}/standalone/"
          ls -l "${{ runner.temp }}/standalone"

      - name: Install with the standalone script (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${{ runner.temp }}/standalone-home"
          mkdir -p "$HOME"
          export MAS_HOME="$HOME/.mas"
          bash "${{ runner.temp }}/standalone/install.sh"

      - name: Install with the standalone script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = "${{ runner.temp }}\standalone-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:MAS_HOME = "$env:USERPROFILE\.mas"
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File "${{ runner.temp }}\standalone\install.ps1" `
            -InstallDir $env:MAS_HOME -SkipPath

      - name: Assert the standalone install is usable
        # The wheel downloaded here is the *published* one, whose installer
        # predates the current registration format. The strict contract is
        # asserted by the standalone-build leg below, which installs a wheel
        # built from this checkout; this leg only asserts that a published
        # release is still usable after being fetched by the script alone.
        shell: bash
        run: python "${{ github.workspace }}/tools/check_install_smoke.py" "${{ runner.temp }}/standalone-home"

  no-python:
    name: install without a Python (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      # This job is the one the others are not.
      #
      # Every other install job begins with actions/setup-python, so the
      # runner already has an interpreter before the installer looks for
      # one. The branch that says "this machine has no Python" was
      # therefore never executed anywhere - not in CI, not on a
      # contributor's machine. A path nobody runs breaks silently, and
      # it breaks exactly where it is hardest to debug: on a beginner's
      # fresh laptop.
      #
      # So this job does *not* set up a Python. It hides every Python
      # from PATH, hands the installer a rehearsal interpreter, and
      # requires the installer to find it with its production lookup.
      #
      # The rehearsal switch (MAS_FORCE_BOOTSTRAP / MAS_BOOTSTRAP_PROBE)
      # is what makes that possible without downloading and installing a
      # real Python on every CI run.
      - uses: actions/checkout@v4

      - name: Find the interpreter to stage (the rehearsal material)
        # The rehearsal needs *a* real interpreter to hand over - one
        # that is not on PATH, or the branch under test would never be
        # entered. The runner images ship one; the setup-python action
        # is deliberately NOT used.
        #
        # The path is platform specific on purpose. A Git Bash path
        # such as /c/hostedtoolcache/... is a POSIX spelling that the
        # Windows installer cannot execute - it would try to open a file
        # whose name starts with a slash. The Windows leg therefore
        # asks the tool cache directly and hands over a native path.
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          interpreter="$(command -v python3 || command -v python || true)"
          if [ -z "$interpreter" ]; then
            echo "::error::no interpreter to stage the rehearsal with"
            exit 1
          fi
          echo "MAS_PROBE_PYTHON=$interpreter" >> "$GITHUB_ENV"

      - name: Find the interpreter to stage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The interpreter has to be a *native* Windows path: the
          # installer starts it as a process, and a POSIX spelling
          # such as /c/hostedtoolcache/... is a file name that starts
          # with a slash, not a path this shell can run.
          #
          # The runner images ship an interpreter on PATH. It is asked
          # for by name - which is what a user would do - and the tool
          # cache is only the fallback for an image that does not.
          $command = $null
          foreach ($name in @('python3.exe', 'python.exe')) {
            $found = Get-Command $name -ErrorAction SilentlyContinue |
              Where-Object { $_.Source -and $_.Source -notmatch 'WindowsApps' } |
              Select-Object -First 1
            if ($found) { $command = $found; break }
          }
          $path = $null
          if ($command) {
            $path = $command.Source
          } else {
            # The fallback spells the path out itself: a file from
            # Get-ChildItem has no Source property, and an empty path
            # would leave the rehearsal with no material at all.
            $cached = Get-ChildItem `
              -Path (Join-Path $env:RUNNER_TOOL_CACHE 'windows\Python') `
              -Filter 'python.exe' -Recurse -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($cached) { $path = $cached.FullName }
          }
          if (-not $path) {
            Write-Output '::error::no interpreter to stage the rehearsal with'
            exit 1
          }
          "MAS_PROBE_PYTHON=$path" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install on a machine that has no Python (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${{ runner.temp }}/bare-home"
          mkdir -p "$HOME"
          export MAS_HOME="$HOME/.mas"
          export MAS_FORCE_BOOTSTRAP=1
          export MAS_BOOTSTRAP_PROBE="${{ runner.temp }}/bare-probe"
          mkdir -p "$MAS_BOOTSTRAP_PROBE"
          # Hide every Python from PATH: the machine has to look bare.
          export PATH="/usr/bin:/bin"
          bash ./install.sh

      - name: Install on a machine that has no Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = "${{ runner.temp }}\bare-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:MAS_HOME = "$env:USERPROFILE\.mas"
          $env:MAS_FORCE_BOOTSTRAP = "1"
          $env:MAS_BOOTSTRAP_PROBE = "${{ runner.temp }}\bare-probe"
          New-Item -ItemType Directory -Force -Path $env:MAS_BOOTSTRAP_PROBE | Out-Null
          # Hide every Python from PATH: the machine has to look bare,
          # or the branch under test is never entered.
          $kept = @()
          foreach ($entry in ($env:PATH -split ';')) {
            if (-not $entry) { continue }
            if (Test-Path -LiteralPath (Join-Path $entry 'python.exe')) { continue }
            if (Test-Path -LiteralPath (Join-Path $entry 'python3.exe')) { continue }
            $kept += $entry
          }
          $env:PATH = ($kept -join ';')
          # A PATHEXT that names no executable at all: the shell then
          # treats python.exe as a *document*, and the installer has to
          # reach its interpreter without the shell's help - which is
          # what a restricted environment really looks like.
          #
          # The installer is started by its *absolute* path for the
          # same reason: with PATHEXT naming no executable, this very
          # shell can no longer resolve a bare 'powershell'. The hostile
          # PATHEXT is the point of the leg, so it has to be set before
          # the installer starts - and the installer has to be reachable
          # without the shell's help to get there.
          $env:PATHEXT = '.CPL'
          $shell = Join-Path $env:SystemRoot `
            'System32\WindowsPowerShell\v1.0\powershell.exe'
          # The installer is started through .NET, not with `&`.
          #
          # With a PATHEXT that names no executable suffix, this shell
          # cannot resolve a native command - not even by absolute path -
          # and the call does not fail: it produces no output and no exit
          # code. The leg would then report a green run while the
          # installer had never started. Starting the process directly
          # keeps the real exit code, so a broken installer is a red
          # leg instead of a silent one.
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $shell
          $psi.Arguments = '-NoProfile -ExecutionPolicy Bypass -File ./install.ps1 ' +
            ('-InstallDir "{0}" -SkipPath -ForceBootstrap -BootstrapProbe "{1}"' -f `
              $env:MAS_HOME, $env:MAS_BOOTSTRAP_PROBE)
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $proc = New-Object System.Diagnostics.Process
          $proc.StartInfo = $psi
          [void]$proc.Start()
          $stdout = $proc.StandardOutput.ReadToEnd()
          $stderr = $proc.StandardError.ReadToEnd()
          $proc.WaitForExit()
          Write-Output $stdout
          if ($stderr) { Write-Output $stderr }
          if ($proc.ExitCode -ne 0) { exit $proc.ExitCode }

      - name: Assert the bootstrap branch really ran and the install is complete
        shell: bash
        run: |
          set -euo pipefail
          python tools/verify_install.py "${{ runner.temp }}/bare-home"

  standalone-build:
    name: standalone script with a locally built wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      # The download leg above proves that a beginner can fetch the published
      # runtime. This leg proves the other half: that the installer installs
      # *exactly* the build it was handed, and that the build in the
      # repository is the one that ends up on disk.
      #
      # A published wheel cannot be used for that assertion - its version
      # legitimately lags the repository until a release is cut - so the
      # wheel is built here and handed to the installer explicitly.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel from this checkout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --wheel --outdir "${{ runner.temp }}/wheel"
          ls -l "${{ runner.temp }}/wheel"

      - name: Stage the installer scripts alone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/standalone"
          cp install.ps1 install.sh "${{ runner.temp }}/standalone/"
          cp tools/verify_install.py "${{ runner.temp }}/standalone/"
          cp tools/check_install_smoke.py "${{ runner.temp }}/standalone/"

      - name: Install the local wheel with the standalone script (Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          export HOME="${{ runner.temp }}/build-home"
          mkdir -p "$HOME"
          export MAS_HOME="$HOME/.mas"
          export MAS_WHEEL="$(ls "${{ runner.temp }}"/wheel/openloop_mas-*.whl | head -1)"
          bash "${{ runner.temp }}/standalone/install.sh"

      - name: Install the local wheel with the standalone script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:USERPROFILE = "${{ runner.temp }}\build-home"
          New-Item -ItemType Directory -Force -Path $env:USERPROFILE | Out-Null
          $env:MAS_HOME = "$env:USERPROFILE\.mas"
          $wheel = (Get-ChildItem "${{ runner.temp }}\wheel\openloop_mas-*.whl" | Select-Object -First 1).FullName
          powershell -NoProfile -ExecutionPolicy Bypass `
            -File "${{ runner.temp }}\standalone\install.ps1" `
            -InstallDir $env:MAS_HOME -SkipPath -Wheel $wheel

      - name: Assert the standalone install is complete and working
        shell: bash
        run: python "${{ runner.temp }}/standalone/verify_install.py" "${{ runner.temp }}/build-home"

      - name: Assert the installed runtime is the one from this checkout
        shell: bash
        run: |
          set -euo pipefail
          python "${{ github.workspace }}/tools/check_installed_version.py" \
            "${{ runner.temp }}/build-home" "${{ github.workspace }}"
