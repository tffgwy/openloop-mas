name: ci-macos

# The macOS leg of the test matrix, kept in its own workflow file.
#
# GitHub cancels macOS runners *while they are still queued* when macOS
# capacity runs out. Such a job reports "cancelled" with zero steps
# executed - nothing was tested at all. When macOS shared a matrix with
# Linux and Windows, that cancellation reddened the whole run and told a
# reader "the project is broken" when no line of the project's code had
# been executed.
#
# ``continue-on-error`` is not enough: a job that GitHub *cancels* is not
# a job that *fails*, and ``continue-on-error`` does not cover the
# cancelled case. A separate workflow file cannot affect another
# workflow's conclusion at all, so this file is the actual fix.
#
# Linux and Windows remain the hard gate in ci.yml.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    # The macOS leg is the slowest of the three: the offline suite alone
    # takes about half an hour on a GitHub-hosted macOS runner. The hour
    # was never a budget for the work; it was a guess. The suite plus
    # the flaky gate needed about eighty minutes on this pool, and at
    # sixty the job was cancelled *by the clock* - which GitHub reports
    # as "cancelled", not "failed". A reader cannot tell that apart
    # from a cancelled runner, so the job said nothing about the code.
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        # One representative version on macOS, not four. The GitHub-hosted
        # macOS pool is the smallest of the three, and when it runs out
        # GitHub cancels the queued runners - a cancelled job is not a
        # failed job, but it still makes *this* workflow red. Asking for
        # four runners is asking to be cancelled three times.
        #
        # The version matrix is fully covered by the Linux and Windows legs
        # in ci.yml, which run all four and are the hard gate. macOS adds
        # the one thing they cannot: proof that the installer and the
        # suite also work on a POSIX system with a macOS toolchain.
        python-version: ["3.12"]
    env:
      # The CLI prints Chinese; keep every runner on UTF-8 regardless of
      # the host code page.
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m mas demo
      - name: Run offline benchmark
        run: python -m mas bench --repeats 1
      - name: Run closure self-check
        run: python -m mas verify
      - name: Self-check
        run: python -m mas doctor

  flaky:
    runs-on: macos-latest
    # The flaky-bug gate gets its own job, with its own budget.
    #
    # It used to sit at the end of the test job, where it shared that
    # job's clock. Split, each half gets the time it actually needs,
    # and a slow gate can no longer hide the result of the suite.
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run the flaky-bug gate
        # The two historical bugs of this project only showed up once in
        # a while. This step hammers the paths that used to fail at
        # random, so a regression is caught by CI instead of by a user.
        #
        # Forty iterations here, a hundred and twenty in ci.yml. The
        # flaky hunt is the Linux and Windows leg's job - they run the
        # full count on four versions each. What this leg adds is the
        # proof that the *same* gates hold on a macOS toolchain, and a
        # hundred and twenty iterations of that on the smallest runner
        # pool in GitHub bought one thing: a job cancelled by the clock.
        # The suite has a wall-clock budget, so this job cannot hang
        # for ever. A check that does not fit in the budget is
        # reported as not reached, and the exit code (3) tells the CI
        # job that the suite did not finish.
        run: python -m mas selftest --iterations 40 --time-budget 900
