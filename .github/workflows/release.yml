name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      TWINE_USERNAME: __token__
      TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI (API token)
        # Classic path: an explicit token in the repository secrets.
        if: ${{ env.TWINE_PASSWORD != '' }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python -m twine upload dist/*
      - name: Publish to PyPI (Trusted Publishing)
        # Tokenless path: PyPI Trusted Publishing. The OIDC token that
        # GitHub mints for this job is exchanged for a short-lived upload
        # token, so no long-lived credential is stored in the repository.
        # One-time setup on pypi.org:
        #   https://pypi.org/manage/project/openloop-mas/settings/publishing/
        #   provider = "GitHub Actions", workflow = "release.yml"
        # The step stays non-fatal so a release is never blocked by an
        # unfinished PyPI registration.
        if: ${{ env.TWINE_PASSWORD == '' }}
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          print-hash: true
          skip-existing: true
      - name: Report the PyPI publish status
        if: always()
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "::warning::The GitHub release was created, but PyPI was not published."
            echo "::warning::Either add the repository secret PYPI_API_TOKEN, or register this workflow as a Trusted Publisher on pypi.org."
          else
            echo "Published to PyPI."
          fi
