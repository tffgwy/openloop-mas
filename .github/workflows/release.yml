name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: dist/*
      - name: Publish to PyPI
        # NOTE: the `secrets` context is not available inside `if:` expressions.
        # Using it there invalidates the whole workflow file, which GitHub
        # reports as a zero-job failed run. The token is therefore passed via
        # `env:` and the step decides what to do with an empty value itself.
        id: publish
        continue-on-error: true
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "::warning::PYPI_API_TOKEN is not configured - skipping the PyPI upload."
            exit 0
          fi
          python -m twine upload dist/*
      - name: Report the PyPI publish status
        if: always()
        env:
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${TWINE_PASSWORD}" ]; then
            echo "::warning::PYPI_API_TOKEN is not configured - the GitHub release was created, but PyPI was not published."
            echo "::warning::Add the repository secret PYPI_API_TOKEN and re-run this workflow to publish."
          elif [ "${{ steps.publish.outcome }}" = "success" ]; then
            echo "Published to PyPI."
          else
            echo "::warning::The PyPI upload failed. The GitHub release was still created."
          fi
