name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The Linux and Windows legs are the hard gate. macOS lives in its own
  # workflow file (ci-macos.yml) on purpose: GitHub cancels macOS runners
  # *while they are still queued* when macOS capacity runs out, and such a
  # job reports "cancelled" with zero steps executed. That is a
  # platform-capacity event, not a defect of the code - but it must not be
  # able to redden the build either.
  #
  # Splitting it into a separate workflow is stronger than
  # ``continue-on-error``: a job that GitHub *cancels* is not a job that
  # *failed*, and ``continue-on-error`` does not cover the cancelled case.
  # A separate workflow file cannot affect this run's conclusion at all.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      # The CLI prints Chinese; keep every runner on UTF-8 regardless of the
      # host code page (Windows runners default to a legacy code page).
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Assert the packaged documents are in step
        # The wheel ships the onboarding documents, and the onboarding gate
        # reads them. A drift between the repository's copy and the packaged
        # copy would make the gate check prose nobody is shipped - so the
        # drift fails here, before it can reach a release.
        run: python tools/sync_packaged_docs.py --check
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m mas demo
      - name: Run offline benchmark
        run: python -m mas bench --repeats 1
      - name: Run closure self-check
        run: python -m mas verify
      - name: Run the flaky-bug gate
        # The two historical bugs of this project only showed up once in
        # a while. This step hammers the paths that used to fail at
        # random, so a regression is caught by CI instead of by a user.
        #
        # The suite has a wall-clock budget, so this job cannot hang
        # for ever. The budget is what the suite is *given*, not a
        # cap on what it may do: a check that does not fit in the
        # budget is reported as not reached, and the exit code (3)
        # tells the CI job that the suite did not finish. A green
        # exit therefore still means "everything ran".
        run: python -m mas selftest --iterations 120 --time-budget 900
      - name: Self-check
        run: python -m mas doctor

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: |
          python -m pip install --upgrade pip ruff
          python -m ruff check mas tests tools

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Check the distribution metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*
      - name: Assert the wheel carries the onboarding documents
        # The onboarding gate watches the README and the quickstart. If the
        # wheel does not carry them, an installed runtime has nothing to
        # watch - and the install reports a failure that says nothing at
        # all about the beginner. So the wheel is opened and looked at.
        run: python tools/check_wheel_docs.py dist/*.whl
      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the documentation site
        run: python tools/build_site.py
      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/
